<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1306 ボット状況</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1B2B; --surface:#102739; --surface2:#15324a;
    --ink:#EAF2F8; --muted:#7C99B2; --hair:#23425e;
    --buy:#3FB984; --sell:#E8A13C; --hold:#5B8BC4; --loss:#E2614B;
    --accent:var(--hold);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);
    font-family:"Zen Kaku Gothic New",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  body{max-width:480px;margin:0 auto;padding:18px 16px 40px;
    min-height:100dvh}
  .mono{font-family:"JetBrains Mono","Zen Kaku Gothic New",monospace}

  /* top bar */
  .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding-bottom:14px;border-bottom:1px solid var(--hair)}
  .sym{font-weight:900;font-size:20px;letter-spacing:.04em}
  .sym small{font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}
  .spacer{flex:1}
  .badge{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;
    border:1px solid var(--hair);color:var(--muted);letter-spacing:.06em}
  .badge.go{color:var(--buy);border-color:color-mix(in srgb,var(--buy) 45%,transparent)}
  .badge.nogo{color:var(--loss);border-color:color-mix(in srgb,var(--loss) 45%,transparent)}
  .badge.mode{color:var(--sell);border-color:color-mix(in srgb,var(--sell) 45%,transparent)}

  /* stale/heartbeat warning */
  .stale-banner{display:none;margin-top:14px;padding:12px 14px;border-radius:12px;
    background:color-mix(in srgb,var(--loss) 16%,transparent);
    border:1px solid color-mix(in srgb,var(--loss) 50%,transparent);
    color:#FFD9CE;font-size:13px;line-height:1.6}
  .stale-banner.show{display:block}
  .stale-banner b{color:var(--loss)}

  /* hero signal */
  .hero{padding:22px 2px 8px}
  .eyebrow{font-size:12px;color:var(--muted);letter-spacing:.18em;
    text-transform:uppercase}
  .signal{font-size:52px;font-weight:900;line-height:1.05;margin-top:6px;
    color:var(--accent);letter-spacing:.02em}
  .reason{margin-top:10px;color:#BFD3E4;font-size:14px;line-height:1.6}

  /* tide gauge (signature) */
  .gauge-wrap{display:flex;gap:18px;margin-top:22px;
    background:var(--surface);border:1px solid var(--hair);
    border-radius:18px;padding:18px 16px}
  .gauge{position:relative;width:64px;height:260px;flex:none;
    background:linear-gradient(#0d2034,#0a1827);
    border:1px solid var(--hair);border-radius:12px;overflow:hidden}
  .buyzone{position:absolute;left:0;right:0;bottom:0;
    background:color-mix(in srgb,var(--buy) 20%,transparent);
    border-top:1px dashed color-mix(in srgb,var(--buy) 60%,transparent)}
  .exitline{position:absolute;left:0;right:0;height:0;
    border-top:1px dashed color-mix(in srgb,var(--sell) 70%,transparent)}
  .fill{position:absolute;left:0;right:0;bottom:0;
    background:linear-gradient(color-mix(in srgb,var(--accent) 55%,transparent),
      color-mix(in srgb,var(--accent) 18%,transparent));
    height:0;transition:height .9s cubic-bezier(.22,1,.36,1)}
  .marker{position:absolute;left:-2px;right:-2px;height:2px;
    background:var(--accent);bottom:0;transition:bottom .9s cubic-bezier(.22,1,.36,1)}
  .marker::after{content:attr(data-rsi);position:absolute;right:72px;
    top:50%;transform:translateY(-50%);white-space:nowrap;
    font-family:"JetBrains Mono",monospace;font-weight:700;font-size:22px;
    color:var(--accent)}
  .gauge-legend{display:flex;flex-direction:column;justify-content:center;gap:16px}
  .leg{display:flex;flex-direction:column;gap:2px}
  .leg b{font-family:"JetBrains Mono",monospace;font-size:15px}
  .leg span{font-size:12px;color:var(--muted)}
  .leg .buy b{color:var(--buy)} .leg .exit b{color:var(--sell)}
  .gap-note{margin-top:4px;font-size:13px;color:#BFD3E4;line-height:1.5}

  /* position card */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .cell{background:var(--surface);border:1px solid var(--hair);
    border-radius:14px;padding:13px 14px}
  .cell.full{grid-column:1/-1}
  .k{font-size:12px;color:var(--muted);letter-spacing:.04em}
  .v{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:20px;
    margin-top:5px}
  .v.pos{color:var(--buy)} .v.neg{color:var(--loss)}
  .pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;
    border-radius:999px;margin-top:5px}
  .pill.on{background:color-mix(in srgb,var(--buy) 18%,transparent);color:var(--buy)}
  .pill.off{background:#1a3045;color:var(--muted)}

  /* footer / loader */
  .foot{margin-top:22px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  button,label.btn{font-family:inherit;font-size:13px;font-weight:700;
    color:var(--ink);background:var(--surface2);border:1px solid var(--hair);
    padding:10px 14px;border-radius:10px;cursor:pointer}
  button:active,label.btn:active{transform:translateY(1px)}
  .updated{font-size:12px;color:var(--muted);margin-left:auto}
  input[type=file]{display:none}
  .hint{margin-top:12px;font-size:12px;color:var(--muted);line-height:1.6}
  .demo-tag{font-size:11px;color:var(--sell);font-weight:700}
  @media (prefers-reduced-motion: reduce){
    .fill,.marker{transition:none}
  }

  /* tabs */
  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tab{flex:1;text-align:center;font-size:13px;font-weight:700;padding:10px 8px;
    border-radius:10px;border:1px solid var(--hair);color:var(--muted);
    background:var(--surface);cursor:pointer}
  .tab.active{color:var(--ink);background:var(--surface2);border-color:var(--hold)}
  .page{display:none}
  .page.active{display:block}

  /* value ranking */
  .vr-meta{font-size:12px;color:var(--muted);line-height:1.7;
    background:var(--surface);border:1px solid var(--hair);border-radius:12px;
    padding:12px 14px;margin-bottom:14px}
  .vr-meta b{color:#BFD3E4}
  .vr-disclaimer{margin-top:6px;color:var(--sell);font-weight:700}
  .vr-list{display:flex;flex-direction:column;gap:8px}
  .vr-row{display:flex;align-items:center;gap:10px;background:var(--surface);
    border:1px solid var(--hair);border-radius:12px;padding:10px 12px}
  .vr-rank{font-family:"JetBrains Mono",monospace;font-weight:700;color:var(--muted);
    width:24px;text-align:right;flex:none}
  .vr-main{flex:1;min-width:0}
  .vr-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vr-code{font-family:"JetBrains Mono",monospace;color:var(--muted);font-size:11px;margin-left:6px}
  .vr-stats{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);margin-top:2px}
  .vr-bar-wrap{width:44px;height:6px;background:#1a3045;border-radius:99px;overflow:hidden;flex:none}
  .vr-bar{height:100%;background:var(--buy)}
  .vr-score{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:13px;
    color:var(--buy);width:38px;text-align:right;flex:none}
</style>
</head>
<body>
  <div class="tabs">
    <div class="tab active" id="tabBot">1306ボット</div>
    <div class="tab" id="tabValue">割安株ランキング</div>
  </div>

  <div class="page active" id="pageBot">
  <div class="top">
    <div class="sym" id="sym">1306 <small id="symName">TOPIX連動ETF</small></div>
    <div class="spacer"></div>
    <span class="badge mode" id="mode">—</span>
    <span class="badge" id="verdict">—</span>
  </div>

  <div class="stale-banner" id="staleBanner"></div>

  <div class="hero">
    <div class="eyebrow" id="eyebrow">今日の判断</div>
    <div class="signal" id="signal">—</div>
    <div class="reason" id="reason">state.json を読み込むと、ボットの今の状態が表示されます。</div>
  </div>

  <div class="gauge-wrap">
    <div class="gauge" id="gauge">
      <div class="buyzone" id="buyzone"></div>
      <div class="exitline" id="exitline"></div>
      <div class="fill" id="fill"></div>
      <div class="marker" id="marker" data-rsi="--"></div>
    </div>
    <div class="gauge-legend">
      <div class="leg exit"><b id="legExit">RSI 50</b><span>利確ライン（回復で売り）</span></div>
      <div class="leg buy"><b id="legBuy">RSI 35</b><span>買いゾーン（押し目）</span></div>
      <div class="gap-note" id="gapNote">—</div>
    </div>
  </div>

  <div class="grid">
    <div class="cell"><div class="k">現在値（調整後）</div><div class="v mono" id="price">—</div></div>
    <div class="cell"><div class="k">ポジション</div><div id="posPill" class="pill off">—</div></div>
  </div>

  <div class="foot">
    <label class="btn" for="file">state.json を選ぶ</label>
    <input type="file" id="file" accept=".json,application/json">
    <button id="refresh">更新</button>
    <span class="updated" id="updated"></span>
  </div>
  <div class="hint" id="hint"></div>
  </div>

  <div class="page" id="pageValue">
    <div class="vr-meta" id="vrPerf" style="display:none"></div>
    <div class="vr-meta" id="vrMeta">value_ranking.json を読み込み中...</div>
    <div class="vr-list" id="vrList"></div>
  </div>

<script>
const $=id=>document.getElementById(id);

const SIGNALS={
  BUY:{ja:"買い",accent:"var(--buy)"},
  SELL:{ja:"売り",accent:"var(--sell)"},
  HOLD:{ja:"待機",accent:"var(--hold)"}
};

function render(s){
  // accent by signal
  const sig=SIGNALS[s.signal]||SIGNALS.HOLD;
  document.documentElement.style.setProperty('--accent',sig.accent);

  $("sym").firstChild.textContent=(s.symbol||"1306")+" ";
  $("mode").textContent=s.mode||"—";
  const v=$("verdict"); v.textContent="判定 "+(s.verdict||"—");
  v.className="badge "+(s.verdict==="GO"?"go":(s.verdict&&s.verdict!=="GO"?"nogo":""));

  $("signal").textContent=sig.ja;
  $("reason").textContent=s.reason||"";

  // gauge
  const rsi=Number(s.rsi); const over=Number(s.rsi_oversold||35); const exit=Number(s.rsi_exit||50);
  const clamp=x=>Math.max(0,Math.min(100,x));
  $("buyzone").style.height=clamp(over)+"%";
  $("exitline").style.bottom=clamp(exit)+"%";
  $("legBuy").textContent="RSI "+Math.round(over);
  $("legExit").textContent="RSI "+Math.round(exit);
  if(!isNaN(rsi)){
    requestAnimationFrame(()=>{
      $("fill").style.height=clamp(rsi)+"%";
      $("marker").style.bottom=clamp(rsi)+"%";
    });
    $("marker").setAttribute("data-rsi",rsi.toFixed(1));
    // gap note: how far to the buy line
    if(s.has_position){
      const d=(exit-rsi);
      $("gapNote").textContent = d>0
        ? `利確まで RSI あと ${d.toFixed(1)}`
        : `利確圏（RSI ${rsi.toFixed(1)} ≧ ${exit}）`;
    }else{
      const d=(rsi-over);
      $("gapNote").textContent = d>0
        ? `買いまで RSI あと ${d.toFixed(1)} 下落`
        : `買いゾーン（RSI ${rsi.toFixed(1)} < ${over}）`;
    }
  }

  // position（金額は非公開のため、保有有無のみ表示）
  $("price").textContent=s.last_price!=null?Number(s.last_price).toFixed(1)+"円":"—";
  const on=!!s.has_position;
  const pp=$("posPill"); pp.textContent=on?"保有あり":"ノーポジ"; pp.className="pill "+(on?"on":"off");

  $("updated").textContent=s.updated?("更新 "+s.updated.replace("T"," ")):"";

  // heartbeat: state.jsonの更新が止まっていないかチェック
  checkStale(s.updated);
}

function checkStale(updatedStr){
  const banner=$("staleBanner");
  if(!updatedStr || updatedStr==="サンプル"){ banner.className="stale-banner"; return; }
  const updated=new Date(updatedStr);
  if(isNaN(updated.getTime())){ banner.className="stale-banner"; return; }

  const now=new Date();
  const hours=(now-updated)/3600000;

  // 土日は市場が閉まっているため許容時間を延ばす（金曜更新→月曜チェックでも警告しない）
  let threshold=30; // 平日: 前回実行からこれ以上空いたら異常
  const day=now.getDay(); // 0=日 1=月 ... 6=土
  if(day===0) threshold=54;       // 日曜に見る場合(金曜更新から最大)
  else if(day===1) threshold=78;  // 月曜に見る場合(金曜更新から最大)
  else if(day===6) threshold=30;

  if(hours>threshold){
    const h=Math.floor(hours);
    banner.innerHTML=`<b>⚠ 更新が止まっています</b><br>最終更新から約${h}時間経過（${updatedStr.replace("T"," ")}）。PCが起動しているか、タスクスケジューラが動いているか確認してください。`;
    banner.className="stale-banner show";
  }else{
    banner.className="stale-banner";
  }
}

const DEMO={symbol:"1306",mode:"DRY-RUN",verdict:"GO",signal:"HOLD",
  reason:"押し目待ち: RSI=49 ≧ 35（サンプル表示）",rsi:48.8,rsi_oversold:35,rsi_exit:50,
  last_price:398.5,has_position:false,
  updated:"サンプル"};

function showDemo(){ render(DEMO); $("hint").innerHTML='<span class="demo-tag">サンプル表示中</span>　実データは「state.json を選ぶ」で読み込み。'; }

async function tryFetch(){
  try{
    const r=await fetch("state.json?"+Date.now(),{cache:"no-store"});
    if(!r.ok) throw 0;
    const s=await r.json(); render(s);
    $("hint").textContent="state.json を自動読み込み（同フォルダをサーバー公開中）。60秒ごとに更新。";
    return true;
  }catch(e){ return false; }
}

$("file").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ render(JSON.parse(rd.result)); $("hint").textContent="読み込み完了："+f.name; }
    catch(err){ $("hint").textContent="このファイルは読めませんでした（JSON形式を確認）。"; } };
  rd.readAsText(f);
});
$("refresh").addEventListener("click",async()=>{ if(!await tryFetch()) $("hint").textContent="自動更新できません。「state.json を選ぶ」で読み込んでください。"; });

(async()=>{
  if(await tryFetch()){ setInterval(tryFetch,60000); }
  else showDemo();
})();

// ---- タブ切り替え ----
function showPage(name){
  $("tabBot").className="tab"+(name==="bot"?" active":"");
  $("tabValue").className="tab"+(name==="value"?" active":"");
  $("pageBot").className="page"+(name==="bot"?" active":"");
  $("pageValue").className="page"+(name==="value"?" active":"");
}
$("tabBot").addEventListener("click",()=>showPage("bot"));
$("tabValue").addEventListener("click",()=>{ showPage("value"); loadValueRanking(); });

// ---- 割安株ランキング ----
let vrLoaded=false;
function renderValueRanking(d){
  const meta=$("vrMeta");
  meta.innerHTML=
    `更新: <b>${(d.updated||"—").replace("T"," ")}</b>　`+
    `対象: <b>${d.universe==="nikkei225"?"日経225":d.universe}</b>（${d.screened}/${d.universe_size}銘柄が質フィルター通過）<br>`+
    `算出方法: ${d.method||""}<br>`+
    `質フィルター: ${d.quality_filter||""}`+
    `<div class="vr-disclaimer">⚠ ${d.disclaimer||"検証済みの売買シグナルではない参考情報です。"}</div>`;

  const list=$("vrList"); list.innerHTML="";
  (d.ranking||[]).forEach(r=>{
    const row=document.createElement("div"); row.className="vr-row";
    const combined=r.combined_score!=null?r.combined_score:r.value_score;
    const pct=Math.round((combined||0)*100);
    const rsiTxt=r.rsi14!=null?`RSI${r.rsi14}`:"";
    const offLowTxt=r.off_low_pct!=null?`底値比+${r.off_low_pct}%`:"";
    const taTxt=(r.turnaround_score!=null)?` / 割安${Math.round(r.value_score*100)} 反発${Math.round(r.turnaround_score*100)}`:"";
    row.innerHTML=
      `<div class="vr-rank">${r.rank}</div>`+
      `<div class="vr-main">`+
        `<div class="vr-name">${r.name}<span class="vr-code">${r.code}</span></div>`+
        `<div class="vr-stats">${r.price!=null?r.price.toFixed(0)+"円 ":""}`+
        `PER${r.per} PBR${r.pbr} 配当${r.dividend_yield_pct}% ROE${r.roe_pct}%</div>`+
        `<div class="vr-stats">${rsiTxt} ${offLowTxt}${taTxt}</div>`+
      `</div>`+
      `<div class="vr-bar-wrap"><div class="vr-bar" style="width:${pct}%"></div></div>`+
      `<div class="vr-score">${pct}</div>`;
    list.appendChild(row);
  });
}

const VR_DEMO={updated:"サンプル",universe:"nikkei225",universe_size:225,screened:0,
  quality_filter:"—",method:"—",disclaimer:"検証済みの売買シグナルではなく、現時点の割安さのスナップショット。売買は自己判断で。",
  ranking:[{rank:1,code:"0000",name:"サンプル銘柄",price:1000,per:10,pbr:0.8,dividend_yield_pct:3.5,roe_pct:8,value_score:0.9}]};

function renderValuePerformance(p){
  const box=$("vrPerf");
  if(!p || !p.tracked_stocks){ box.style.display="none"; return; }
  const sign=v=>v>0?"pos":(v<0?"neg":"");
  box.style.display="block";
  const confLine = p.confidence_pct!=null
    ? `信用度 <b style="color:var(--ink)">${p.confidence_pct}%</b>（${p.confidence_note||""}）`
    : `信用度 <span style="color:var(--sell)">${p.confidence_note||"計測中"}</span>`;
  box.innerHTML=
    `<b>追跡成績</b>（累計${p.history_runs}営業日・${p.oldest_run_date}〜、追跡${p.tracked_stocks}銘柄）<br>`+
    `「初めてTOP50に入った時点で買い、持ち続けていたら」の仮想成績:<br>`+
    `平均 <span class="mono v ${sign(p.avg_return_pct)}" style="font-size:14px;display:inline">${p.avg_return_pct>0?'+':''}${p.avg_return_pct}%</span>`+
    `　勝率 ${p.win_rate_pct}%`+
    (p.avg_excess_vs_nikkei225_pct!=null?`　日経225比 ${p.avg_excess_vs_nikkei225_pct>0?'+':''}${p.avg_excess_vs_nikkei225_pct}%`:"")+
    `<br>${confLine}`;
}

async function loadValueRanking(){
  if(vrLoaded) return;
  try{
    const r=await fetch("value_ranking.json?"+Date.now(),{cache:"no-store"});
    if(!r.ok) throw 0;
    renderValueRanking(await r.json());
    vrLoaded=true;
  }catch(e){
    renderValueRanking(VR_DEMO);
    $("vrMeta").innerHTML+='<br><span class="demo-tag">サンプル表示中（value_ranking.jsonが同フォルダにありません）</span>';
  }
  try{
    const rp=await fetch("value_performance.json?"+Date.now(),{cache:"no-store"});
    if(rp.ok) renderValuePerformance(await rp.json());
  }catch(e){ /* 追跡データがまだ無くても致命的ではない */ }
}
</script>
</body>
</html>
